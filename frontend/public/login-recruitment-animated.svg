<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 380" width="100%" height="100%" fill="none" aria-label="HireStream Intelligent Recruitment and Verification Architecture">
  <defs>
    <!-- Multi-stop Background Ambient Glows -->
    <radialGradient id="ambienceBlue" cx="28%" cy="32%" r="58%">
      <stop offset="0%" stop-color="#1E6FF0" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#6366F1" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1E6FF0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ambiencePurple" cx="78%" cy="70%" r="52%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.18"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>

    <!-- Linear Brand Gradients -->
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="emeraldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="amberGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Glassmorphic Card Surfaces -->
    <linearGradient id="glassSurface" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.90"/>
    </linearGradient>
    <linearGradient id="glassDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" stop-opacity="0.94"/>
      <stop offset="100%" stop-color="#1E293B" stop-opacity="0.92"/>
    </linearGradient>

    <!-- Refined Drop Shadows and Glows -->
    <filter id="shadowElevated" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="12" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.08"/>
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0F172A" flood-opacity="0.04"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1E6FF0" flood-opacity="0.25"/>
    </filter>
    <filter id="glowEmerald" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.25"/>
    </filter>
    <filter id="subtleShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F172A" flood-opacity="0.06"/>
    </filter>
  </defs>

  <style>
    @keyframes floatPrimary {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatSecondary {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(8px); }
    }
    @keyframes floatBadge {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }
    @keyframes conduitFlow {
      0% { stroke-dashoffset: 80; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pulseRing {
      0% { r: 3.5px; opacity: 1; }
      75% { r: 15px; opacity: 0; }
      100% { r: 15px; opacity: 0; }
    }
    @keyframes shimmerStar {
      0%, 100% { transform: scale(0.8) rotate(0deg); opacity: 0.4; }
      50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
    }
    @keyframes eqWave1 { 0%, 100% { height: 6px; y: 12px; } 50% { height: 20px; y: 5px; } }
    @keyframes eqWave2 { 0%, 100% { height: 18px; y: 6px; } 50% { height: 8px; y: 11px; } }
    @keyframes eqWave3 { 0%, 100% { height: 10px; y: 10px; } 50% { height: 22px; y: 4px; } }
    @keyframes eqWave4 { 0%, 100% { height: 16px; y: 7px; } 50% { height: 7px; y: 11.5px; } }

    .anim-primary { animation: floatPrimary 5.2s ease-in-out infinite; }
    .anim-secondary { animation: floatSecondary 4.8s ease-in-out infinite 0.6s; }
    .anim-badge { animation: floatBadge 4s ease-in-out infinite; }
    .anim-conduit { stroke-dasharray: 6, 8; animation: conduitFlow 2s linear infinite; }
    .anim-pulse { animation: pulseRing 2.4s cubic-bezier(0, 0.2, 0.8, 1) infinite; }
    .anim-shimmer { transform-origin: center; animation: shimmerStar 3.2s ease-in-out infinite; }
    .anim-eq1 { animation: eqWave1 0.95s ease-in-out infinite; }
    .anim-eq2 { animation: eqWave2 0.8s ease-in-out infinite 0.15s; }
    .anim-eq3 { animation: eqWave3 1.1s ease-in-out infinite 0.35s; }
    .anim-eq4 { animation: eqWave4 0.85s ease-in-out infinite 0.1s; }

    @media (prefers-reduced-motion: reduce) {
      .anim-primary, .anim-secondary, .anim-badge, .anim-conduit, .anim-pulse,
      .anim-shimmer, .anim-eq1, .anim-eq2, .anim-eq3, .anim-eq4 {
        animation: none !important;
      }
    }
  </style>

  <!-- Ambient Backdrop Glows -->
  <rect width="540" height="380" rx="24" fill="url(#ambienceBlue)"/>
  <rect width="540" height="380" rx="24" fill="url(#ambiencePurple)"/>

  <!-- Geometric Futuristic Precision Net & Orbital Rings -->
  <g opacity="0.18" stroke="#3B82F6" stroke-width="0.75">
    <circle cx="270" cy="190" r="170" stroke-dasharray="3, 5"/>
    <circle cx="270" cy="190" r="105" stroke-dasharray="2, 4"/>
    <line x1="50" y1="95" x2="490" y2="95" stroke-dasharray="4, 6"/>
    <line x1="50" y1="285" x2="490" y2="285" stroke-dasharray="4, 6"/>
    <line x1="140" y1="30" x2="140" y2="350" stroke-dasharray="4, 6"/>
    <line x1="400" y1="30" x2="400" y2="350" stroke-dasharray="4, 6"/>
  </g>

  <!-- Dynamic Data Conduits (Connecting Nodes Behind Cards) -->
  <g opacity="0.65">
    <path d="M 85,170 C 160,85 300,70 445,130" stroke="#93C5FD" stroke-width="2" fill="none"/>
    <path d="M 85,170 C 160,85 300,70 445,130" stroke="#2563EB" stroke-width="2" fill="none" class="anim-conduit"/>
    
    <path d="M 125,295 C 240,340 370,305 455,235" stroke="#C4B5FD" stroke-width="1.8" fill="none"/>
    <path d="M 125,295 C 240,340 370,305 455,235" stroke="#8B5CF6" stroke-width="1.8" fill="none" class="anim-conduit"/>
  </g>

  <!-- Top Floating System Telemetry Pill -->
  <g class="anim-badge" transform="translate(170, 18)">
    <rect width="200" height="34" rx="17" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1" filter="url(#subtleShadow)"/>
    <circle cx="18" cy="17" r="4.5" fill="#10B981"/>
    <circle cx="18" cy="17" r="4.5" fill="none" stroke="#10B981" stroke-width="1.5" class="anim-pulse"/>
    <text x="32" y="21" font-family="'Inter', system-ui, sans-serif" font-size="11.5" font-weight="600" fill="#0F172A">
      Hiring Pipeline
    </text>
    <rect x="135" y="8" width="54" height="18" rx="9" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="0.8"/>
    <text x="162" y="20.5" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#059669" text-anchor="middle">ONLINE</text>
  </g>

  <!-- ==================== PRIMARY HERO CARD: Candidate Evaluation & Match ==================== -->
  <g class="anim-primary" transform="translate(30, 66)">
    <!-- Base Card Container -->
    <rect width="280" height="240" rx="18" fill="url(#glassSurface)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadowElevated)"/>

    <!-- Header Section: Candidate Identity -->
    <g transform="translate(18, 18)">
      <!-- Avatar with Gradient Ring & Online Dot -->
      <circle cx="24" cy="24" r="23" fill="#EEF2FF" stroke="#3B82F6" stroke-width="1.8"/>
      <!-- Stylized Person Avatar Silhouette -->
      <path d="M 14,40 C 14,33 18,29 24,29 C 30,29 34,33 34,40 Z" fill="url(#blueGradient)"/>
      <circle cx="24" cy="21" r="7.5" fill="url(#blueGradient)"/>
      <!-- Verified Shield Badge -->
      <circle cx="39" cy="38" r="6.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.6"/>
      <path d="M 36.5,38 L 38.5,40 L 41.5,36" stroke="#FFFFFF" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

      <!-- Candidate Name & Position -->
      <text x="56" y="20" font-family="'Inter', system-ui, sans-serif" font-size="14.5" font-weight="700" fill="#0F172A">Elena Rostova</text>
      <text x="56" y="36" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="500" fill="#64748B">Staff Frontend Engineer</text>
    </g>

    <!-- Talent Fit Scorecard Metric -->
    <g transform="translate(18, 86)">
      <rect width="244" height="42" rx="10" fill="#F0F7FF" stroke="#BFDBFE" stroke-width="0.8"/>
      <text x="12" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" fill="#1E40AF" letter-spacing="0.5">COMPETENCY MATCH</text>
      <text x="202" y="25" font-family="'Inter', system-ui, sans-serif" font-size="15" font-weight="800" fill="#1D4ED8">98%</text>

      <!-- Progress Meter -->
      <rect x="12" y="26" width="175" height="6" rx="3" fill="#DBEAFE"/>
      <rect x="12" y="26" width="171" height="6" rx="3" fill="url(#blueGradient)"/>
    </g>

    <!-- Verified Skill Badges -->
    <g transform="translate(18, 142)">
      <rect x="0" y="0" width="70" height="24" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="35" y="16" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">React 19</text>

      <rect x="78" y="0" width="78" height="24" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="117" y="16" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">TypeScript</text>

      <rect x="164" y="0" width="80" height="24" rx="7" fill="#F1F5F9" stroke="#E2E8F0" stroke-width="0.8"/>
      <text x="204" y="16" font-family="'Inter', system-ui, sans-serif" font-size="10" font-weight="600" fill="#334155" text-anchor="middle">Cloud Native</text>
    </g>

    <!-- Offer Approved Milestone Strip -->
    <g transform="translate(18, 182)">
      <rect width="244" height="42" rx="10" fill="#F0FDF4" stroke="#BBF7D0" stroke-width="1"/>
      <circle cx="21" cy="21" r="11" fill="url(#emeraldGradient)"/>
      <path d="M 16.5,21 L 19.5,24 L 25.5,17.5" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="40" y="18" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#14532D">Consensus: Ready for Offer</text>
      <text x="40" y="32" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="500" fill="#16A34A">Unanimous panel approval achieved</text>
    </g>
  </g>

  <!-- ==================== SECONDARY HERO CARD: Interview Video & Consensus ==================== -->
  <g class="anim-secondary" transform="translate(280, 116)">
    <!-- Base Card Container -->
    <rect width="232" height="202" rx="18" fill="url(#glassSurface)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#shadowElevated)"/>

    <!-- Live Interview Feed Snippet -->
    <g transform="translate(16, 16)">
      <!-- Dark Video Frame -->
      <rect width="200" height="56" rx="10" fill="url(#glassDark)" stroke="#334155" stroke-width="1"/>

      <!-- Panelist 1 (Interviewer Video Tile) -->
      <g transform="translate(12, 11)">
        <rect width="44" height="34" rx="6" fill="#1E293B"/>
        <circle cx="22" cy="15" r="7" fill="#8B5CF6"/>
        <path d="M 13,31 C 13,25 17,23 22,23 C 27,23 31,25 31,31 Z" fill="#A78BFA"/>
      </g>

      <!-- Panelist 2 (Candidate Video Tile) -->
      <g transform="translate(62, 11)">
        <rect width="44" height="34" rx="6" fill="#1E293B"/>
        <circle cx="22" cy="15" r="7" fill="#2563EB"/>
        <path d="M 13,31 C 13,25 17,23 22,23 C 27,23 31,25 31,31 Z" fill="#60A5FA"/>
      </g>

      <!-- Dynamic Voice Equalizer Waves -->
      <g transform="translate(122, 15)">
        <rect x="0" width="3" rx="1.5" fill="#10B981" class="anim-eq1"/>
        <rect x="7" width="3" rx="1.5" fill="#10B981" class="anim-eq2"/>
        <rect x="14" width="3" rx="1.5" fill="#10B981" class="anim-eq3"/>
        <rect x="21" width="3" rx="1.5" fill="#10B981" class="anim-eq4"/>
        <rect x="36" y="4" width="34" height="18" rx="9" fill="#064E3B"/>
        <text x="53" y="16.5" font-family="'Inter', system-ui, sans-serif" font-size="8.5" font-weight="700" fill="#34D399" text-anchor="middle">LIVE</text>
      </g>
    </g>

    <!-- Scorecard 5-Star Rating -->
    <g transform="translate(16, 84)">
      <rect width="200" height="42" rx="9" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="12" y="25" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1E293B">Scorecard</text>
      
      <!-- 5 Golden Stars -->
      <g transform="translate(86, 15)" fill="url(#amberGradient)">
        <!-- Star 1 -->
        <path d="M 5,0 L 6.5,3.3 L 10,3.8 L 7.5,6.2 L 8.1,9.7 L 5,8 L 1.9,9.7 L 2.5,6.2 L 0,3.8 L 3.5,3.3 Z"/>
        <!-- Star 2 -->
        <path d="M 5,0 L 6.5,3.3 L 10,3.8 L 7.5,6.2 L 8.1,9.7 L 5,8 L 1.9,9.7 L 2.5,6.2 L 0,3.8 L 3.5,3.3 Z" transform="translate(17, 0)"/>
        <!-- Star 3 -->
        <path d="M 5,0 L 6.5,3.3 L 10,3.8 L 7.5,6.2 L 8.1,9.7 L 5,8 L 1.9,9.7 L 2.5,6.2 L 0,3.8 L 3.5,3.3 Z" transform="translate(34, 0)"/>
        <!-- Star 4 -->
        <path d="M 5,0 L 6.5,3.3 L 10,3.8 L 7.5,6.2 L 8.1,9.7 L 5,8 L 1.9,9.7 L 2.5,6.2 L 0,3.8 L 3.5,3.3 Z" transform="translate(51, 0)"/>
        <!-- Star 5 -->
        <path d="M 5,0 L 6.5,3.3 L 10,3.8 L 7.5,6.2 L 8.1,9.7 L 5,8 L 1.9,9.7 L 2.5,6.2 L 0,3.8 L 3.5,3.3 Z" transform="translate(68, 0)"/>
        <text x="88" y="10.5" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#D97706">5.0</text>
      </g>
    </g>

    <!-- Panelist Approvals Row -->
    <g transform="translate(16, 138)">
      <!-- Panelist Avatars -->
      <circle cx="14" cy="14" r="13" fill="#2563EB" stroke="#FFFFFF" stroke-width="2"/>
      <text x="14" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">SC</text>
      
      <circle cx="34" cy="14" r="13" fill="#7C3AED" stroke="#FFFFFF" stroke-width="2"/>
      <text x="34" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">JD</text>

      <circle cx="54" cy="14" r="13" fill="#059669" stroke="#FFFFFF" stroke-width="2"/>
      <text x="54" y="18" font-family="'Inter', system-ui, sans-serif" font-size="9.5" font-weight="700" fill="#FFFFFF" text-anchor="middle">MK</text>

      <!-- Label & Check -->
      <text x="76" y="18" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#334155">3 Approvals</text>
      <path d="M 180,11 L 185,16 L 194,7" stroke="#10B981" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>

    <!-- Enterprise SLA Footer Note -->
    <g transform="translate(16, 175)">
      <circle cx="6" cy="6" r="3" fill="#2563EB"/>
      <text x="14" y="9" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="500" fill="#64748B">SLA Compliance: 100% on schedule</text>
    </g>
  </g>

  <!-- ==================== FLOATING AUTOMATED WORKFLOW PILL ==================== -->
  <g class="anim-badge" transform="translate(325, 48)">
    <rect width="186" height="36" rx="18" fill="#FFFFFF" stroke="#3B82F6" stroke-width="1.2" filter="url(#glowBlue)"/>
    <circle cx="18" cy="18" r="9" fill="url(#blueGradient)"/>
    <path d="M 14.5,18 L 17,20.5 L 21.5,15.5" stroke="#FFFFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="34" y="22" font-family="'Inter', system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#0F172A">
      Automated Pipeline
    </text>
  </g>

  <!-- Ambient Shimmer Twinkles -->
  <g class="anim-shimmer" transform="translate(305, 34)" opacity="0.85">
    <polygon points="5,0 6.2,3.5 10,4.5 6.2,5.5 5,10 3.8,5.5 0,4.5 3.8,3.5" fill="#3B82F6"/>
  </g>
  <g class="anim-shimmer" transform="translate(505, 160)" opacity="0.85">
    <polygon points="4,0 5,2.8 7.8,3.6 5,4.4 4,7.2 3,4.4 0.2,3.6 3,2.8" fill="#F59E0B"/>
  </g>
  <g class="anim-shimmer" transform="translate(18, 195)" opacity="0.85">
    <polygon points="4,0 5,2.8 7.8,3.6 5,4.4 4,7.2 3,4.4 0.2,3.6 3,2.8" fill="#10B981"/>
  </g>
</svg>
