<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 350" width="100%" height="100%" fill="none" aria-label="HireStream Collaborative Recruitment and Interview Platform">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FF0" stop-opacity="0.10"/>
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#10B981" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E6FF0"/>
      <stop offset="100%" stop-color="#1656C2"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#6D28D9"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F8FAFC"/>
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0F172A" flood-opacity="0.08"/>
    </filter>
    <filter id="glowGreen" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#10B981" flood-opacity="0.3"/>
    </filter>
    <filter id="glowBlue" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#1E6FF0" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes floatMain {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-7px); }
    }
    @keyframes floatSub {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-9px); }
    }
    @keyframes floatPill {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-5px) scale(1.02); }
    }
    @keyframes pulseRing {
      0% { r: 3.5px; opacity: 1; }
      70% { r: 11px; opacity: 0; }
      100% { r: 11px; opacity: 0; }
    }
    @keyframes wave1 {
      0%, 100% { height: 4px; y: 13px; }
      50% { height: 13px; y: 8.5px; }
    }
    @keyframes wave2 {
      0%, 100% { height: 12px; y: 9px; }
      50% { height: 5px; y: 12.5px; }
    }
    @keyframes wave3 {
      0%, 100% { height: 6px; y: 12px; }
      50% { height: 15px; y: 7.5px; }
    }
    @keyframes sparkle {
      0%, 100% { transform: scale(0.7) rotate(0deg); opacity: 0.3; }
      50% { transform: scale(1.2) rotate(45deg); opacity: 1; }
    }
    @keyframes progressScan {
      0% { width: 35px; }
      50% { width: 110px; }
      100% { width: 35px; }
    }

    .anim-float-main { animation: floatMain 4.8s ease-in-out infinite; }
    .anim-float-sub { animation: floatSub 4.2s ease-in-out infinite 0.6s; }
    .anim-pill { animation: floatPill 3.6s ease-in-out infinite alternate; }
    .anim-radar { animation: pulseRing 2.2s cubic-bezier(0.1, 0.7, 0.4, 1) infinite; }
    .anim-wave1 { animation: wave1 0.9s ease-in-out infinite; }
    .anim-wave2 { animation: wave2 0.75s ease-in-out infinite; }
    .anim-wave3 { animation: wave3 1.1s ease-in-out infinite; }
    .anim-sparkle { transform-origin: center; animation: sparkle 3s ease-in-out infinite; }
    .anim-progress { animation: progressScan 5s ease-in-out infinite; }

    @media (prefers-reduced-motion: reduce) {
      .anim-float-main, .anim-float-sub, .anim-pill, .anim-radar, .anim-wave1, .anim-wave2, .anim-wave3, .anim-sparkle, .anim-progress {
        animation: none !important;
      }
    }
  </style>

  <!-- Base Ambient Panel Glow -->
  <rect width="500" height="350" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Futuristic Architecture Grid -->
  <g opacity="0.18" stroke="#1E6FF0" stroke-width="0.8" stroke-dasharray="3,4">
    <circle cx="250" cy="175" r="150"/>
    <circle cx="250" cy="175" r="90"/>
    <line x1="40" y1="85" x2="460" y2="85"/>
    <line x1="40" y1="265" x2="460" y2="265"/>
    <line x1="130" y1="25" x2="130" y2="325"/>
    <line x1="370" y1="25" x2="370" y2="325"/>
  </g>

  <!-- Top Pipeline Stage Bar -->
  <g transform="translate(45, 20)">
    <rect width="410" height="38" rx="10" fill="#FFFFFF" fill-opacity="0.94" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>
    
    <!-- Stage 1: Applied -->
    <g transform="translate(25, 19)">
      <circle cx="0" cy="0" r="8" fill="#1E6FF0" fill-opacity="0.15"/>
      <circle cx="0" cy="0" r="4" fill="#1E6FF0"/>
      <text x="14" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="600" fill="#334155">Sourced</text>
    </g>

    <!-- Connector 1 -->
    <line x1="98" y1="19" x2="130" y2="19" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Stage 2: Interviewing -->
    <g transform="translate(155, 19)">
      <circle cx="0" cy="0" r="8" fill="#8B5CF6" fill-opacity="0.18"/>
      <circle cx="0" cy="0" r="4" fill="#8B5CF6"/>
      <text x="14" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#6D28D9">Interview</text>
    </g>

    <!-- Connector 2 -->
    <line x1="230" y1="19" x2="262" y2="19" stroke="#CBD5E1" stroke-width="1.5" stroke-dasharray="2,2"/>

    <!-- Stage 3: Offer & Hired -->
    <g transform="translate(286, 19)">
      <circle cx="0" cy="0" r="8" fill="#10B981" fill-opacity="0.18"/>
      <path d="M-2.5 0 L-0.5 2 L3 -1.5" stroke="#059669" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      <text x="14" y="3.5" font-family="system-ui, -apple-system, sans-serif" font-size="10.5" font-weight="700" fill="#047857">Hired</text>
    </g>

    <!-- Live Status Dot -->
    <g transform="translate(378, 19)">
      <circle cx="0" cy="0" r="3.5" fill="#10B981"/>
      <circle cx="0" cy="0" r="3.5" fill="none" stroke="#10B981" stroke-width="1.5" class="anim-radar"/>
    </g>
  </g>

  <!-- Left / Main Card: Candidate Evaluation & Skills (Elena Rostova) -->
  <g class="anim-float-main" transform="translate(38, 76)">
    <rect width="245" height="195" rx="14" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>

    <!-- Candidate Profile Header -->
    <g transform="translate(16, 16)">
      <!-- Avatar with Gradient -->
      <circle cx="20" cy="20" r="18" fill="url(#primaryGrad)"/>
      <text x="20" y="24.5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">ER</text>
      <!-- Online Badge -->
      <circle cx="32" cy="31" r="4.5" fill="#10B981" stroke="#FFFFFF" stroke-width="1.5"/>

      <text x="48" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">Elena Rostova</text>
      <text x="48" y="30" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="500" fill="#64748B">Staff Frontend Engineer</text>
    </g>

    <!-- Role Match Score Bar -->
    <g transform="translate(16, 68)">
      <rect width="213" height="32" rx="8" fill="#EDF3FE" stroke="#D3E4FD" stroke-width="1"/>
      <text x="10" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1E6FF0">TALENT MATCH</text>
      <text x="175" y="21" font-family="system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="800" fill="#1E6FF0">98%</text>

      <!-- Meter -->
      <rect x="10" y="20" width="145" height="4.5" rx="2.2" fill="#CBD5E1"/>
      <rect x="10" y="20" width="138" height="4.5" rx="2.2" fill="url(#primaryGrad)" class="anim-progress"/>
    </g>

    <!-- Skill Tags -->
    <g transform="translate(16, 110)">
      <rect width="62" height="20" rx="6" fill="#F1F5F9"/>
      <text x="31" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">React 19</text>

      <rect x="68" width="68" height="20" rx="6" fill="#F1F5F9"/>
      <text x="102" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">TypeScript</text>

      <rect x="142" width="73" height="20" rx="6" fill="#F1F5F9"/>
      <text x="178.5" y="14" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#334155" text-anchor="middle">Architecture</text>
    </g>

    <!-- Offer Accepted Decision Pill -->
    <g transform="translate(16, 142)">
      <rect width="213" height="38" rx="8" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1"/>
      <circle cx="18" cy="19" r="9" fill="#10B981"/>
      <path d="M14.5 19 L17.5 22 L22.5 16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
      
      <text x="36" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="700" fill="#065F46">Decision: Offer Extended</text>
      <text x="36" y="28" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="500" fill="#059669">Unanimous consensus across all rounds</text>
    </g>
  </g>

  <!-- Right / Sub Card: Video Interview & Scorecard Consensus -->
  <g class="anim-float-sub" transform="translate(262, 118)">
    <rect width="202" height="152" rx="14" fill="url(#cardGrad)" stroke="#E2E8F0" stroke-width="1.2" filter="url(#softShadow)"/>

    <!-- Video Interview Screen Snippet -->
    <g transform="translate(14, 14)">
      <!-- Video Screen Frame -->
      <rect width="174" height="46" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1"/>
      <!-- Interviewer Thumbnail -->
      <rect x="8" y="8" width="40" height="30" rx="5" fill="#1E293B"/>
      <circle cx="28" cy="20" r="7" fill="#8B5CF6"/>
      <text x="28" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">SC</text>

      <!-- Candidate Video -->
      <rect x="54" y="8" width="40" height="30" rx="5" fill="#1E293B"/>
      <circle cx="74" cy="20" r="7" fill="#1E6FF0"/>
      <text x="74" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="7" font-weight="700" fill="#FFFFFF" text-anchor="middle">ER</text>

      <!-- Live Equalizer Waves -->
      <g transform="translate(112, 14)">
        <rect x="2" width="2.5" rx="1" fill="#10B981" class="anim-wave1"/>
        <rect x="8" width="2.5" rx="1" fill="#10B981" class="anim-wave2"/>
        <rect x="14" width="2.5" rx="1" fill="#10B981" class="anim-wave3"/>
        <rect x="20" width="2.5" rx="1" fill="#10B981" class="anim-wave1"/>
        <text x="28" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#10B981">LIVE</text>
      </g>
    </g>

    <!-- Scorecard Consensus -->
    <g transform="translate(14, 72)">
      <rect width="174" height="32" rx="7" fill="#F8FAFC" stroke="#E2E8F0" stroke-width="1"/>
      <text x="10" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#334155">Scorecard</text>
      <!-- 5 Golden Stars -->
      <g transform="translate(92, 10)" fill="#F59E0B">
        <path d="M5 0 L6.5 3.2 L10 3.7 L7.5 6.1 L8.1 9.5 L5 7.9 L1.9 9.5 L2.5 6.1 L0 3.7 L3.5 3.2 Z" transform="scale(0.8) translate(0, 0)"/>
        <path d="M5 0 L6.5 3.2 L10 3.7 L7.5 6.1 L8.1 9.5 L5 7.9 L1.9 9.5 L2.5 6.1 L0 3.7 L3.5 3.2 Z" transform="scale(0.8) translate(14, 0)"/>
        <path d="M5 0 L6.5 3.2 L10 3.7 L7.5 6.1 L8.1 9.5 L5 7.9 L1.9 9.5 L2.5 6.1 L0 3.7 L3.5 3.2 Z" transform="scale(0.8) translate(28, 0)"/>
        <path d="M5 0 L6.5 3.2 L10 3.7 L7.5 6.1 L8.1 9.5 L5 7.9 L1.9 9.5 L2.5 6.1 L0 3.7 L3.5 3.2 Z" transform="scale(0.8) translate(42, 0)"/>
        <path d="M5 0 L6.5 3.2 L10 3.7 L7.5 6.1 L8.1 9.5 L5 7.9 L1.9 9.5 L2.5 6.1 L0 3.7 L3.5 3.2 Z" transform="scale(0.8) translate(56, 0)"/>
      </g>
    </g>

    <!-- Panelist Sign-Offs -->
    <g transform="translate(14, 114)">
      <circle cx="10" cy="12" r="10" fill="#1E6FF0"/>
      <text x="10" y="15.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">SC</text>
      
      <circle cx="26" cy="12" r="10" fill="#8B5CF6"/>
      <text x="26" y="15.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">AR</text>

      <circle cx="42" cy="12" r="10" fill="#10B981"/>
      <text x="42" y="15.5" font-family="system-ui, -apple-system, sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle">MK</text>

      <text x="60" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#475569">3 Approvals Submitted</text>
      <path d="M158 12 L162 16 L169 9" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
  </g>

  <!-- Floating Fast-Action Pill (Top Right) -->
  <g class="anim-pill" transform="translate(285, 75)">
    <rect width="165" height="32" rx="16" fill="#FFFFFF" stroke="#1E6FF0" stroke-width="1.2" filter="url(#glowBlue)"/>
    <circle cx="16" cy="16" r="8" fill="#1E6FF0"/>
    <path d="M13 16 L15.5 18.5 L19.5 13.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <text x="30" y="20" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#0F172A">Automated Pipeline</text>
  </g>

  <!-- Celebratory Twinkles -->
  <g class="anim-sparkle" transform="translate(280, 52)">
    <polygon points="5,0 6.5,3.5 10,5 6.5,6.5 5,10 3.5,6.5 0,5 3.5,3.5" fill="#10B981"/>
  </g>
  <g class="anim-sparkle" transform="translate(460, 105)">
    <polygon points="4,0 5.2,2.8 8,4 5.2,5.2 4,8 2.8,5.2 0,4 2.8,2.8" fill="#F59E0B"/>
  </g>
  <g class="anim-sparkle" transform="translate(25, 140)">
    <polygon points="4,0 5.2,2.8 8,4 5.2,5.2 4,8 2.8,5.2 0,4 2.8,2.8" fill="#1E6FF0"/>
  </g>

  <!-- Bottom Strip: Enterprise SLA & Insights -->
  <g transform="translate(155, 305)">
    <rect width="190" height="26" rx="13" fill="#FFFFFF" fill-opacity="0.95" stroke="#CBD5E1" stroke-width="0.8" filter="url(#softShadow)"/>
    <circle cx="16" cy="13" r="4" fill="#1E6FF0"/>
    <text x="26" y="17" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#475569">Real-Time SLA &amp; Scorecard Sync</text>
    <path d="M168 11 L173 16 L180 8" stroke="#10B981" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>
