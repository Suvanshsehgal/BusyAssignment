<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 220" width="100%" height="100%">
  <defs>
    <linearGradient id="intBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#1E6FF0" stop-opacity="0.06"/>
    </linearGradient>
    <linearGradient id="videoGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A1D24"/>
      <stop offset="100%" stop-color="#0F1115"/>
    </linearGradient>
    <linearGradient id="starGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="intCardShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0F1115" flood-opacity="0.08"/>
    </filter>
    <filter id="intPillShadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1D9E75" flood-opacity="0.25"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseRec {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.25; }
    }
    @keyframes wave1 {
      0%, 100% { height: 6px; y: 15px; }
      50% { height: 18px; y: 9px; }
    }
    @keyframes wave2 {
      0%, 100% { height: 16px; y: 10px; }
      50% { height: 7px; y: 14.5px; }
    }
    @keyframes wave3 {
      0%, 100% { height: 10px; y: 13px; }
      50% { height: 22px; y: 7px; }
    }
    @keyframes wave4 {
      0%, 100% { height: 20px; y: 8px; }
      50% { height: 9px; y: 13.5px; }
    }
    @keyframes starPulse {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0 rgba(245, 158, 11, 0)); }
      50% { transform: scale(1.15); filter: drop-shadow(0 0 4px rgba(245, 158, 11, 0.6)); }
    }
    @keyframes floatBadgeInt {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
    .rec-dot { animation: pulseRec 1.6s infinite; }
    .audio-bar-1 { animation: wave1 0.9s ease-in-out infinite; }
    .audio-bar-2 { animation: wave2 0.8s ease-in-out infinite; }
    .audio-bar-3 { animation: wave3 1.1s ease-in-out infinite; }
    .audio-bar-4 { animation: wave4 0.75s ease-in-out infinite; }
    .star-glow { transform-origin: center; animation: starPulse 2.8s ease-in-out infinite; }
    .floating-int-badge { animation: floatBadgeInt 3.8s ease-in-out infinite alternate; }
  </style>

  <!-- Background Base -->
  <rect width="520" height="220" rx="10" fill="url(#intBgGrad)"/>

  <!-- Left: Video Call Assessment Window -->
  <g transform="translate(30, 28)">
    <!-- Video Window Container -->
    <rect width="210" height="158" rx="8" fill="url(#videoGrad)" stroke="#262B35" stroke-width="1.2" filter="url(#intCardShadow)"/>
    
    <!-- Top Bar with REC Badge -->
    <rect x="12" y="12" width="56" height="18" rx="9" fill="#000000" fill-opacity="0.55"/>
    <circle cx="21" cy="21" r="3.5" fill="#EF4444" class="rec-dot"/>
    <text x="30" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#FFFFFF">LIVE 45m</text>

    <!-- Candidate Silhouette / Avatar in Video -->
    <circle cx="105" cy="72" r="24" fill="#262B35" stroke="#374151" stroke-width="1.5"/>
    <circle cx="105" cy="66" r="9" fill="#9CA3AF"/>
    <path d="M90 88 Q105 77 120 88" fill="#9CA3AF"/>
    
    <!-- Video Candidate Name Tag -->
    <rect x="12" y="124" width="105" height="20" rx="4" fill="#000000" fill-opacity="0.6"/>
    <text x="20" y="138" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#F3F4F6">David Chen • SDE II</text>

    <!-- Audio Frequency Bars (Right corner of video) -->
    <g transform="translate(150, 118)">
      <rect x="0" y="13" width="3" height="10" rx="1.5" fill="#1D9E75" class="audio-bar-1"/>
      <rect x="6" y="8" width="3" height="16" rx="1.5" fill="#1D9E75" class="audio-bar-2"/>
      <rect x="12" y="7" width="3" height="18" rx="1.5" fill="#1D9E75" class="audio-bar-3"/>
      <rect x="18" y="11" width="3" height="12" rx="1.5" fill="#1D9E75" class="audio-bar-4"/>
      <rect x="24" y="9" width="3" height="15" rx="1.5" fill="#1D9E75" class="audio-bar-2"/>
      <rect x="30" y="14" width="3" height="8" rx="1.5" fill="#1D9E75" class="audio-bar-1"/>
    </g>
  </g>

  <!-- Right: Structured Scorecard & Rating Assessment -->
  <g transform="translate(255, 28)">
    <rect width="235" height="158" rx="8" fill="#FFFFFF" fill-opacity="0.9" stroke="#E7E9EE" stroke-width="1.2" filter="url(#intCardShadow)"/>
    
    <!-- Header -->
    <text x="16" y="24" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#111111">Interview Scorecard</text>
    <text x="16" y="38" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" fill="#6B7280">System Architecture &amp; Coding</text>

    <!-- Evaluation Criteria 1: Problem Solving -->
    <g transform="translate(16, 48)">
      <rect width="203" height="24" rx="4" fill="#F5F7FB" stroke="#E7E9EE" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="6" fill="#1D9E75"/>
      <path d="M9.5 12 L11.5 14 L14.5 10" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#111111">Data Structures &amp; Algorithms</text>
      <text x="185" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1D9E75">5/5</text>
    </g>

    <!-- Evaluation Criteria 2: System Architecture -->
    <g transform="translate(16, 76)">
      <rect width="203" height="24" rx="4" fill="#F5F7FB" stroke="#E7E9EE" stroke-width="0.8"/>
      <circle cx="12" cy="12" r="6" fill="#1D9E75"/>
      <path d="M9.5 12 L11.5 14 L14.5 10" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="24" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#111111">Scalable Architecture</text>
      <text x="185" y="15" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#1D9E75">4/5</text>
    </g>

    <!-- Score Rating Stars -->
    <g transform="translate(16, 112)">
      <text x="0" y="12" font-family="system-ui, -apple-system, sans-serif" font-size="9" font-weight="600" fill="#4A4A4A">Overall Score:</text>
      <!-- 5 Stars with Glowing Animation -->
      <g transform="translate(72, -1)">
        <!-- Star 1 -->
        <path d="M7 1 L9 5 L13.5 5.5 L10 8.5 L11 13 L7 10.5 L3 13 L4 8.5 L0.5 5.5 L5 5 Z" fill="url(#starGrad)"/>
        <!-- Star 2 -->
        <path d="M23 1 L25 5 L29.5 5.5 L26 8.5 L27 13 L23 10.5 L19 13 L20 8.5 L16.5 5.5 L21 5 Z" fill="url(#starGrad)"/>
        <!-- Star 3 -->
        <path d="M39 1 L41 5 L45.5 5.5 L42 8.5 L43 13 L39 10.5 L35 13 L36 8.5 L32.5 5.5 L37 5 Z" fill="url(#starGrad)"/>
        <!-- Star 4 -->
        <path d="M55 1 L57 5 L61.5 5.5 L58 8.5 L59 13 L55 10.5 L51 13 L52 8.5 L48.5 5.5 L53 5 Z" fill="url(#starGrad)"/>
        <!-- Star 5 (Pulsing) -->
        <g class="star-glow">
          <path d="M71 1 L73 5 L77.5 5.5 L74 8.5 L75 13 L71 10.5 L67 13 L68 8.5 L64.5 5.5 L69 5 Z" fill="url(#starGrad)"/>
        </g>
      </g>
    </g>

    <!-- Recommendation Footer -->
    <g transform="translate(16, 134)">
      <rect width="203" height="16" rx="4" fill="#ECFDF5"/>
      <text x="101" y="11.5" font-family="system-ui, -apple-system, sans-serif" font-size="8.5" font-weight="700" fill="#047857" text-anchor="middle">Recommendation: Strong Hire ✓</text>
    </g>
  </g>

  <!-- Top Floating Badge: Feedback Verified -->
  <g transform="translate(195, 12)" class="floating-int-badge">
    <rect width="140" height="24" rx="12" fill="#FFFFFF" stroke="#1D9E75" stroke-width="1.2" filter="url(#intPillShadow)"/>
    <circle cx="16" cy="12" r="4" fill="#1D9E75"/>
    <path d="M14 12 L15.5 13.5 L18 10.5" fill="none" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
    <text x="26" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="9.5" font-weight="700" fill="#111111">Scorecard Synced</text>
  </g>
</svg>
